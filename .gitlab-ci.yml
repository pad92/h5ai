stages:
  - lint
  - build
  - test
  - scan
  - publish
  - release

default:
  tags:
    - chataigne

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

lint:
  stage: lint
  image: node:20-slim
  script:
    - npm ci
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

build:
  stage: build
  image: node:20-slim
  script:
    - apt-get update && apt-get install -y git
    - npm ci
    - npm run build
  artifacts:
    paths:
      - build/h5ai-*.zip
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

test:
  stage: test
  image: node:20-slim
  script:
    - npm ci
    - npm run test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

scan:trivy:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --skip-dirs .npm_cache,node_modules,build .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

publish:
  stage: publish
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "master"
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        CLEAN_VERSION=$(echo "$CI_COMMIT_TAG" | sed 's/^v//')
      elif [ "$CI_COMMIT_BRANCH" = "master" ]; then
        CLEAN_VERSION="master"
      fi
    - ZIP_FILE=$(ls build/h5ai-*.zip | head -n 1)
    - |
      if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
        echo "Error: No zip file found matching build/h5ai-*.zip"
        echo "Available files in build/:"
        ls -la build/
        exit 1
      fi
    - echo "Uploading $ZIP_FILE to GitLab Package Registry as h5ai-${CLEAN_VERSION}.zip..."
    - |
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file "$ZIP_FILE" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/h5ai/${CLEAN_VERSION}/h5ai-${CLEAN_VERSION}.zip"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Uploading $ZIP_FILE to GitLab Package Registry as latest/h5ai-latest.zip..."
        curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$ZIP_FILE" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/h5ai/latest/h5ai-latest.zip"
      fi

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - VERSION=$CI_COMMIT_TAG
    - CLEAN_VERSION=$(echo "$VERSION" | sed 's/^v//')
    - echo "Extracting release notes for $CLEAN_VERSION (from tag $VERSION)..."
    - |
      # Extract notes between ## v$CLEAN_VERSION (or ## $CLEAN_VERSION) and the next ## header
      awk -v ver="$CLEAN_VERSION" '{ gsub(/\r$/, "") } /^## / { if ($2 == "v"ver || $2 == ver) flag=1; else flag=0; next } flag' CHANGELOG.md > release_notes.txt
    - |
      if [ ! -s release_notes.txt ]; then
        echo "No specific notes found in CHANGELOG.md for $VERSION." > release_notes.txt
      fi
    - PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/h5ai/${CLEAN_VERSION}/h5ai-${CLEAN_VERSION}.zip"
    - |
      release-cli create --name "$VERSION" \
        --description "$(cat release_notes.txt)" \
        --assets-link "{\"name\":\"h5ai-${CLEAN_VERSION}.zip\",\"url\":\"${PACKAGE_URL}\",\"link_type\":\"package\"}"
