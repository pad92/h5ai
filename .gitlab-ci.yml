stages:
  - lint
  - dependencies
  - build
  - test
  - scan
  - publish
  - release

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  tags:
    - chataigne

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  # Docker image published to Docker Hub under this name.
  IMAGE_NAME: pad92/docker-h5ai
  # Multi-platform candidate that `build:candidate` pushes by digest, without
  # a tag, on publishable pipelines; Grype scans it and the publish jobs
  # promote that digest. GitLab.com's online garbage collector deletes an
  # untagged manifest after 24 hours, so a candidate that is never published
  # leaves nothing behind, and a published one is kept by its tags.
  CANDIDATE_IMAGE: "$CI_REGISTRY_IMAGE"
  # BuildKit's layer cache stays in the runner host's persistent `h5ai-ci`
  # builder, not in the registry; it is pruned down to this size.
  BUILDKIT_CACHE_MAX_USED: "20gb"
  # BuildKit of the `h5ai-ci` builder, pinned by digest. Watchtower runs on
  # the runner host and replaces a container whose tag gets a new image: when
  # buildx's default `moby/buildkit:buildx-stable-1` moved, it stopped the
  # builder in the middle of a build. It leaves an image pinned by digest
  # alone. A new digest here recreates the builder (see .docker-build-base).
  BUILDKIT_IMAGE: "moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea"
  # Job and scanner containers pinned by digest. These jobs receive registry
  # credentials and, for the docker ones, the runner's Docker socket, so the
  # container holding them must not be swappable — pinning only the scanners
  # would leave that outer container mutable underneath them. Other job images
  # (node, hadolint, the php test base, curl, release-cli) and the privileged helper are
  # pinned as well.
  DOCKER_IMAGE: "docker:28@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac"
  GRYPE_IMAGE: "anchore/grype:v0.121.1@sha256:6b06708b036f74b2cd70e94b706b4586af96d1932e6ac46255940b2e39dd44a9"
  SYFT_IMAGE: "anchore/syft:v1.56.0@sha256:697ae864af1299cfa43c54b161cea3dd65c6d54de82e3dba66ea3dccb3acc313"

# Every job runs on the single `chataigne` runner, which keeps this cache
# locally: node_modules is reused as long as the lockfile and the Node major
# version stay the same, so node jobs only install on a cache miss.
cache: &node_cache
  key:
    prefix: node24
    files:
      - package-lock.json
  paths:
    - .npm/
    - node_modules/
  policy: pull

.pipeline-rules: &pipeline_rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH
  - if: $CI_COMMIT_TAG

.publish-rules: &publish_rules
  - if: $CI_COMMIT_BRANCH == "master"
  - if: $CI_COMMIT_TAG

.build-image-rules: &build_image_rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "master"

.dockerhub-publish-rules: &dockerhub_publish_rules
  - if: $CI_COMMIT_BRANCH == "master" && $DOCKERHUB_USERNAME && $DOCKERHUB_PASSWORD
  - if: $CI_COMMIT_TAG && $DOCKERHUB_USERNAME && $DOCKERHUB_PASSWORD

# Shared by every node-based job to avoid repeating image + install.
.node-job:
  image: node:24.22.2-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c
  before_script:
    - '[ -x node_modules/.bin/gulp ] || npm ci --prefer-offline --no-audit --no-fund'

# ── Lint ─────────────────────────────────────────────────────────────────────

lint:app:
  extends: .node-job
  stage: lint
  needs: []
  # First node job of the pipeline: it fills the cache for the others.
  cache:
    <<: *node_cache
    policy: pull-push
  script:
    - npm run lint
  rules: *pipeline_rules

lint:dockerfile:
  stage: lint
  image: ghcr.io/hadolint/hadolint:v2.15.1-debian@sha256:9a3944b7fddcb947d1ffd90829ac1a6e5c30479223358f249d8b96c7d0019e27
  needs: []
  cache: []
  script:
    - hadolint --failure-threshold error Dockerfile ci/php-test.Dockerfile ci/ffmpeg.Dockerfile
  rules: *pipeline_rules

test:ffmpeg-package:
  stage: lint
  image: $DOCKER_IMAGE
  needs: []
  cache: []
  script:
    - sh test/ci/ffmpeg-package.sh
  rules: *pipeline_rules

# ── Build ────────────────────────────────────────────────────────────────────

build:app:
  extends: .node-job
  stage: build
  needs:
    - job: lint:app
  script:
    # gulp reads the version from scripts/version.sh: the tag, else the commit.
    - npm run build
  artifacts:
    paths:
      - build/h5ai-*.zip
    expire_in: 1 day
  rules: *pipeline_rules

.docker-build-base:
  image: $DOCKER_IMAGE
  # Serializes package publication, QEMU registration and the shared builder.
  resource_group: docker-build
  cache: []
  needs:
    - job: lint:dockerfile
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      # Each job starts a new buildx client that does not know the builder,
      # so it is created every time; create then reuses the host's container,
      # whatever image it runs. A container from another BuildKit image (the
      # default one before the pin, or an older digest) is removed first; its
      # layer cache stays in the buildx_buildkit_h5ai-ci0_state volume.
      BUILDER_IMAGE=$(docker inspect --format '{{.Config.Image}}' buildx_buildkit_h5ai-ci0 2>/dev/null) || BUILDER_IMAGE=
      if [ -n "$BUILDER_IMAGE" ] && [ "$BUILDER_IMAGE" != "$BUILDKIT_IMAGE" ]; then
        echo "Replacing the h5ai-ci builder container ($BUILDER_IMAGE)"
        docker rm -f buildx_buildkit_h5ai-ci0
      fi
      docker buildx inspect h5ai-ci >/dev/null 2>&1 || docker buildx create --name h5ai-ci --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE"
    # Version/build metadata consumed by the Dockerfile ARGs (image labels).
    # The tag of a tag pipeline, else the commit id (scripts/version.sh).
    - H5AI_VERSION=$(sh scripts/version.sh)
    - BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
    - BUILD_ARGS="--build-arg H5AI_VERSION=$H5AI_VERSION --build-arg BUILD_DATE=$BUILD_DATE --build-arg BUILD_VCSREF=$CI_COMMIT_SHORT_SHA"
  after_script:
    - docker buildx prune --builder h5ai-ci --force --max-used-space "$BUILDKIT_CACHE_MAX_USED" || true
  rules: *pipeline_rules

.docker-multiarch:
  before_script:
    - !reference [.docker-build-base, before_script]
    - sh scripts/ffmpeg-qemu.sh

# Check the registry on every pipeline, compile only missing packages.
prepare:ffmpeg:
  extends: .docker-build-base
  needs:
    - job: lint:dockerfile
    - job: test:ffmpeg-package
  stage: dependencies
  timeout: 2h
  before_script:
    - !reference [.docker-build-base, before_script]
    - apk add --no-cache curl
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ] || [ "${CI_COMMIT_BRANCH:-}" = "$CI_DEFAULT_BRANCH" ]; then
        FFMPEG_ARCHES="amd64 arm64"
        FFMPEG_PUBLISH=1
      else
        case "$(docker info --format '{{.Architecture}}')" in
          x86_64|amd64) FFMPEG_ARCHES=amd64 ;;
          aarch64|arm64) FFMPEG_ARCHES=arm64 ;;
          *) echo "Unsupported Docker host architecture" >&2; exit 1 ;;
        esac
        FFMPEG_PUBLISH=0
      fi
      export FFMPEG_ARCHES FFMPEG_PUBLISH
    - |
      if [ "$FFMPEG_PUBLISH" = 1 ]; then
        sh scripts/ffmpeg-qemu.sh
      fi
  script:
    - FFMPEG_BUILDER=h5ai-ci sh scripts/ffmpeg-package.sh $FFMPEG_ARCHES
  artifacts:
    paths:
      - .ffmpeg/
    expire_in: 1 day

# Branch and MR image, single platform, left in the runner host's Docker for
# test:docker and scan:grype:branch-image (all run on the same host through
# its socket): no tarball artifact goes back and forth to GitLab. The
# persistent `h5ai-ci` builder keeps BuildKit's layer cache between
# pipelines. cleanup:image removes the image at the end of the pipeline;
# images of cancelled pipelines are pruned after a day.
build:image:
  extends: .docker-build-base
  stage: build
  rules: *build_image_rules
  needs:
    - job: lint:dockerfile
    - job: prepare:ffmpeg
      artifacts: true
  script:
    - docker image prune --all --force --filter label=h5ai.ci-pipeline --filter until=24h
    - |
      docker buildx build \
        --builder h5ai-ci \
        --load \
        --pull \
        $BUILD_ARGS \
        --label "h5ai.ci-pipeline=$CI_PIPELINE_ID" \
        -t "h5ai-ci:$CI_PIPELINE_ID" \
        .

# Publishable pipelines assemble both platforms using prepared FFmpeg packages.
build:candidate:
  extends: .docker-build-base
  stage: build
  rules: *publish_rules
  timeout: 2h
  needs:
    - job: lint:dockerfile
    - job: prepare:ffmpeg
      artifacts: true
  before_script:
    - !reference [.docker-multiarch, before_script]
  script:
    - |
      docker buildx build \
        --builder h5ai-ci \
        --platform linux/amd64,linux/arm64 \
        --provenance=false \
        --metadata-file build-metadata.json \
        $BUILD_ARGS \
        --output "type=image,name=$CANDIDATE_IMAGE,push-by-digest=true,name-canonical=true,push=true" \
        .
      CANDIDATE_DIGEST=$(sed -n 's/.*"containerimage\.digest"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' build-metadata.json | head -n1)
      printf 'CANDIDATE_DIGEST=%s\n' "${CANDIDATE_DIGEST:-none}" > build.env
      echo "Candidate pushed: $CANDIDATE_IMAGE@${CANDIDATE_DIGEST:-none}"
      rm -f build-metadata.json
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 day

# ── Test ─────────────────────────────────────────────────────────────────────

test:app:
  extends: .node-job
  stage: test
  needs:
    - job: lint:app
  script:
    - npm run test:coverage
  artifacts:
    paths:
      - coverage/js/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/js/cobertura-coverage.xml
    expire_in: 1 week
  rules: *pipeline_rules

# The PHP environment (GD, Xdebug, PHPUnit) is built once on the runner host
# and kept by its Docker layer cache; the tests run in it on this job's
# checkout, shared with --volumes-from (see scan:grype:deps for why).
test:php:
  stage: test
  image: $DOCKER_IMAGE
  needs: []
  cache: []
  script:
    - docker build -q -t h5ai-php-test:ci -f ci/php-test.Dockerfile ci
    - JOB_CONTAINER_ID=$(docker ps -q -f "label=com.gitlab.gitlab-runner.job.id=$CI_JOB_ID")
    # The suite runs unprivileged, like the web server: as root, the
    # permission tests skip themselves and the search index refuses to
    # refresh. The checkout belongs to root, so only the folders the tests
    # write to (the coverage report, the command probe cache) are handed over.
    - |
      docker run --rm --volumes-from "$JOB_CONTAINER_ID" -w "$CI_PROJECT_DIR" -e XDEBUG_MODE=coverage h5ai-php-test:ci sh -ec '
        find src test/php -name "*.php" -print0 | xargs -0 -n1 php -l
        mkdir -p coverage/php
        chown www-data: coverage/php src/_h5ai/private/cache
        setpriv --reuid=www-data --regid=www-data --clear-groups php /usr/local/bin/phpunit.phar --coverage-cobertura coverage/php/cobertura.xml --coverage-text --only-summary-for-coverage-text'
  artifacts:
    paths:
      - coverage/php/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/php/cobertura.xml
    expire_in: 1 week
  rules: *pipeline_rules

# One weighted line percentage, rather than an average of language percentages.
test:coverage:
  image: node:24.22.2-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c
  stage: test
  needs:
    - job: test:app
      artifacts: true
    - job: test:php
      artifacts: true
  cache: []
  script:
    - node scripts/coverage-summary.js
  coverage: '/Total line coverage: ([0-9]+(?:\.[0-9]+)?)%/'
  rules: *pipeline_rules

test:docker:
  stage: test
  image: $DOCKER_IMAGE
  # Publishable pipelines test the exact candidate digest; branches and MRs
  # keep the local single-platform image because they do not build a candidate.
  needs:
    - job: build:image
      artifacts: false
      optional: true
    - job: build:candidate
      artifacts: true
      optional: true
  cache: []
  before_script:
    # GNU tar: test-php-tar.sh extracts PAX long and Unicode names.
    - apk add --no-cache curl tar
  script:
    - sh test/docker/s6-config.sh
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ] || [ "${CI_COMMIT_BRANCH:-}" = "master" ]; then
        if [ -z "${CANDIDATE_DIGEST:-}" ] || [ "$CANDIDATE_DIGEST" = "none" ]; then
          echo "ERROR: candidate digest missing on a publishable pipeline" >&2
          exit 1
        fi
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        TEST_IMAGE_REF="$CANDIDATE_IMAGE@$CANDIDATE_DIGEST"
        docker pull "$TEST_IMAGE_REF"
        echo "Runtime checks use candidate $TEST_IMAGE_REF"
        RUNTIME_ARCH=$(docker info --format '{{.Architecture}}')
        case "$RUNTIME_ARCH" in
          x86_64|amd64) RUNTIME_PLATFORM=linux/amd64 ;;
          aarch64|arm64) RUNTIME_PLATFORM=linux/arm64 ;;
          *) RUNTIME_PLATFORM="linux/$RUNTIME_ARCH" ;;
        esac
        echo "HTTP and authentication checks exercise $RUNTIME_PLATFORM only; the Grype scan covers linux/amd64 and linux/arm64."
      else
        # Left in the host's Docker by build:image.
        TEST_IMAGE_REF="h5ai-ci:$CI_PIPELINE_ID"
        echo "Runtime checks use branch image $TEST_IMAGE_REF"
      fi
    - |
      # wait_http <curl extra args> <expected status> <ok msg> <fail msg> <container>
      # Polls http://$TEST_IP/ until the status line matches (15 s max);
      # on failure removes the container and fails the job.
      wait_http() {
        for i in $(seq 1 15); do
          if curl -s -I $1 "http://${TEST_IP}/" | grep -q "HTTP/1.1 $2"; then
            echo "✓ $3"
            return 0
          fi
          sleep 1
        done
        echo "✗ $4"
        docker rm -f "$5"
        exit 1
      }
    - echo "Testing container without authentication..."
    - docker run -d --name h5ai-test-noauth -v "$CI_PROJECT_DIR:/share:ro" "$TEST_IMAGE_REF"
    - TEST_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' h5ai-test-noauth)
    - wait_http "" "200 OK" "Public index page returned 200 OK" "Public index page test failed" h5ai-test-noauth
    - |
      # The image must carry the build's version and the changelog it opens.
      # Bodies are read whole and matched with case: with pipefail, a pipe
      # into `grep -q` or `head` fails when the reader stops before the
      # writer has written everything.
      EXPECTED_VERSION=$(sh scripts/version.sh)
      case "$EXPECTED_VERSION" in
        [0-9]*.[0-9]*.[0-9]*) EXPECTED_LABEL="v$EXPECTED_VERSION" ;;
        *) EXPECTED_LABEL="$EXPECTED_VERSION" ;;
      esac
      PAGE=$(curl -fsS "http://${TEST_IP}/") || PAGE=
      case "$PAGE" in
        *"powered by h5ai $EXPECTED_LABEL "*|*"powered by h5ai $EXPECTED_LABEL<"*) ;;
        *)
          echo "✗ The page does not show version ${EXPECTED_LABEL}"
          docker rm -f h5ai-test-noauth
          exit 1
          ;;
      esac
      echo "✓ The page shows version ${EXPECTED_LABEL}"
      CHANGELOG=$(curl -fsS "http://${TEST_IP}/_h5ai/CHANGELOG.md") || CHANGELOG=
      case "$CHANGELOG" in
        "# Changelog"*) ;;
        *)
          echo "✗ /_h5ai/CHANGELOG.md is missing from the image"
          docker rm -f h5ai-test-noauth
          exit 1
          ;;
      esac
      echo "✓ /_h5ai/CHANGELOG.md is served"
    - docker rm -f h5ai-test-noauth

    - echo "Testing container with basic authentication..."
    - docker run -d --name h5ai-test-auth -e ENV_U=admin -e ENV_P=secret -v "$CI_PROJECT_DIR:/share:ro" "$TEST_IMAGE_REF"
    - TEST_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' h5ai-test-auth)
    - wait_http "" "401 Unauthorized" "Unauthenticated request correctly blocked (401 Unauthorized)" "Unauthenticated request test failed (did not return 401)" h5ai-test-auth
    - wait_http "-u admin:secret" "200 OK" "Authenticated request successfully bypassed basic auth" "Authenticated request test failed (rejected credentials or PHP-FPM not ready)" h5ai-test-auth
    - docker rm -f h5ai-test-auth

    # Downloads and thumbnails: the fixtures are copied into the container
    # (see test/docker/lib.sh), so these run here as they do with `make
    # docker-test`. The media test exercises the image's own ffmpeg build.
    - sh test/docker/test-php-tar.sh "$TEST_IMAGE_REF"
    - sh test/docker/test-document-thumbs.sh "$TEST_IMAGE_REF"
    - sh test/docker/test-media-thumbs.sh "$TEST_IMAGE_REF"

    - echo "Validating the served HTML and CSS (local W3C Nu Html Checker)..."
    - sh test/docker/test-w3c.sh "$TEST_IMAGE_REF"
    - echo "All tests passed successfully!"
  rules: *pipeline_rules

test:docker-publish:
  stage: test
  image: $DOCKER_IMAGE
  needs: []
  cache: []
  script:
    - sh test/docker/publish-dockerhub.sh
    - sh test/docker/tag-plan.sh
  rules: *pipeline_rules

# ── Scan ─────────────────────────────────────────────────────────────────────

# Grype and Syft ship as `FROM scratch` images with no shell, so they cannot be
# used as a GitLab CI job `image:` (GitLab needs a shell to run `script:`).
# They are invoked through `docker run` from the Docker image instead.
#
# Gate policy: `--only-fixed --fail-on high`, i.e. parity with the Trivy policy
# this replaces. Measured on the published image, dropping `--only-fixed` and
# lowering the threshold yielded 235 findings of which only 2 were fixable (144
# were ffmpeg CVEs awaiting an Alpine fix), so publishing would currently block
# on predominantly unfixed findings.
scan:grype:image:
  stage: scan
  # The Grype database lives in the runner host's `h5ai-grype-db` volume:
  # only updates are downloaded. One scan at a time may update it.
  resource_group: grype-db
  needs:
    - job: build:candidate
      artifacts: true
  cache: []
  image: $DOCKER_IMAGE
  script:
    - |
      if [ -z "$CANDIDATE_DIGEST" ] || [ "$CANDIDATE_DIGEST" = "none" ]; then
        echo "ERROR: CANDIDATE_DIGEST not exported by the build stage" >&2
        exit 1
      fi
      CANDIDATE_REF="$CANDIDATE_IMAGE@$CANDIDATE_DIGEST"
      # Scan every published platform before failing, so amd64 findings cannot
      # mask arm64 ones: under the runner's `set -e`, a plain loop would stop at
      # the first hit. Grype exits 2 for a policy finding and 1 for an
      # operational error — the latter must abort now rather than be silently
      # recorded as "scanned", so the gate fails closed.
      status=0
      for platform in linux/amd64 linux/arm64; do
        echo "Scanning $CANDIDATE_REF ($platform)..."
        set +e
        docker run --rm \
          -e GRYPE_REGISTRY_AUTH_AUTHORITY="$CI_REGISTRY" \
          -e GRYPE_REGISTRY_AUTH_USERNAME="$CI_REGISTRY_USER" \
          -e GRYPE_REGISTRY_AUTH_PASSWORD="$CI_REGISTRY_PASSWORD" \
          -e GRYPE_DB_CACHE_DIR=/grype-db -v h5ai-grype-db:/grype-db \
          "$GRYPE_IMAGE" "registry:$CANDIDATE_REF" \
          --platform "$platform" --only-fixed --fail-on high
        rc=$?
        set -e
        case "$rc" in
          0) echo "✓ $platform clean" ;;
          2) echo "✗ $platform: fixable vulnerabilities at or above high"; status=1 ;;
          *) echo "ERROR: grype failed on $platform (exit $rc)" >&2; exit 1 ;;
        esac
      done
      exit $status
  rules: *publish_rules

# Branch and MR image, scanned where build:image left it, through the host's
# Docker socket: a Dockerfile change shows its findings before the merge,
# with the gate of scan:grype:image. Single platform (the runner's).
scan:grype:branch-image:
  stage: scan
  resource_group: grype-db
  needs:
    - job: build:image
      artifacts: false
  cache: []
  image: $DOCKER_IMAGE
  script:
    - |
      docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -e GRYPE_DB_CACHE_DIR=/grype-db -v h5ai-grype-db:/grype-db \
        "$GRYPE_IMAGE" "docker:h5ai-ci:$CI_PIPELINE_ID" \
        --only-fixed --fail-on high
  rules: *build_image_rules

# The multi-stage Dockerfile discards the npm build stage, so node_modules and
# package-lock.json never reach the final image and scan:grype:image cannot see
# npm dependencies at all. This job is the only thing that audits them.
#
# It does NOT use `grype dir:`: Grype's directory scan skips lockfile entries
# marked `"dev": true`, cataloging 2 packages here instead of 704 and reporting
# "No vulnerabilities found" no matter what — a vacuous gate. Syft is therefore
# run explicitly with dev dependencies enabled and Grype matches the resulting
# SBOM. Grype honours neither SYFT_* nor GRYPE_* forms of that setting.
#
# This scan is blocking: a release must not proceed when the lockfile contains
# a fixable high-severity dependency vulnerability.
#
# This runner uses Docker socket binding (no dind service): `docker run` here
# talks to the host daemon and spawns *sibling* containers, so `-v
# "$CI_PROJECT_DIR:...` resolves against the host's filesystem, not this job
# container's — a mismatch that either sees an empty/stale directory or, for a
# file this job itself just wrote (npm-sbom.json), fails outright with "no
# such file or directory". `--volumes-from` against this job's own container
# reuses its real mounts instead of guessing a host path.
scan:grype:deps:
  stage: scan
  # The Grype database lives in the runner host's `h5ai-grype-db` volume:
  # only updates are downloaded. One scan at a time may update it.
  resource_group: grype-db
  needs: []
  cache: []
  image: $DOCKER_IMAGE
  script:
    - |
      JOB_CONTAINER_ID=$(docker ps -q -f "label=com.gitlab.gitlab-runner.job.id=$CI_JOB_ID")
      docker run --rm \
        --volumes-from "$JOB_CONTAINER_ID:ro" \
        -e SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES=true \
        "$SYFT_IMAGE" dir:"$CI_PROJECT_DIR" \
        --source-name h5ai --source-version "$CI_COMMIT_SHORT_SHA" \
        --exclude './node_modules/**' \
        --exclude './build/**' \
        --exclude './.npm/**' \
        -o syft-json > npm-sbom.json
      docker run --rm --volumes-from "$JOB_CONTAINER_ID:ro" \
        -e GRYPE_DB_CACHE_DIR=/grype-db -v h5ai-grype-db:/grype-db \
        "$GRYPE_IMAGE" sbom:"$CI_PROJECT_DIR/npm-sbom.json" --only-fixed --fail-on high
  artifacts:
    paths:
      - npm-sbom.json
    expire_in: 1 week
    when: always
  rules: *pipeline_rules

# ── Publish ──────────────────────────────────────────────────────────────────

# Uploads the versioned zip consumed by create_release. The former
# `latest/h5ai-latest.zip` and master-branch uploads had a single consumer —
# the separate docker-h5ai repository — which now builds from source in-tree.
publish:app:
  stage: publish
  image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
  cache: []
  # needs (not just the stage barrier) so this job's own DAG position really
  # gates on the test suite, not only on build:app — see
  # .docker-publish-template below for the same requirement on image publish.
  # The dependency scan is listed explicitly because needs() disables the
  # normal stage barrier for this job.
  needs:
    - job: build:app
      artifacts: true
    - job: test:app
    - job: test:php
    - job: test:coverage
    - job: scan:grype:deps
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - CLEAN_VERSION=$(echo "$CI_COMMIT_TAG" | sed 's/^v//')
    - ZIP_FILE=$(ls build/h5ai-*.zip | head -n 1)
    - |
      if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
        echo "Error: No zip file found matching build/h5ai-*.zip"
        echo "Available files in build/:"
        ls -la build/
        exit 1
      fi
    - echo "Uploading $ZIP_FILE to GitLab Package Registry as h5ai-${CLEAN_VERSION}.zip..."
    - |
      curl --fail-with-body --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file "$ZIP_FILE" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/h5ai/${CLEAN_VERSION}/h5ai-${CLEAN_VERSION}.zip"

# Publishing does not rebuild: it promotes the scanned candidate's digest to
# the final tags with `docker buildx imagetools create`, so the published
# images are bit-identical to what the scan stage validated.
.docker-publish-template:
  stage: publish
  image: $DOCKER_IMAGE
  # Keep tag-plan evaluation and alias promotion serialized across both registries.
  resource_group: docker-publish
  cache: []
  before_script:
    - apk add --no-cache curl jq
  # `needs` puts this job in DAG mode, so it only waits for what it lists here
  # — it does NOT automatically wait for the rest of the `scan`/`test` stages
  # the way a stage-barrier job would. scan:grype:image must be listed
  # explicitly, otherwise the image could be promoted before (or even if) the
  # vulnerability scan fails. test:app/test:php/test:docker are listed for the
  # same reason: without them, a failing test would no longer block the
  # published image. The dependency scan is also required before promotion.
  needs:
    - job: build:candidate
      artifacts: true
    - job: scan:grype:image
    - job: scan:grype:deps
    - job: test:app
    - job: test:php
    - job: test:coverage
    - job: test:docker
    - job: test:docker-publish
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      if [ -n "$PUBLISH_REGISTRY_LOGIN_CMD" ]; then
        eval "$PUBLISH_REGISTRY_LOGIN_CMD"
      fi
    - |
      TAG_PLAN=$(sh scripts/docker-tag-plan.sh "$CI_COMMIT_TAG" "$CI_COMMIT_BRANCH")
      IMMUTABLE_TAGS=$(printf '%s\n' "$TAG_PLAN" | sed -n '1p')
      MOVING_TAGS=$(printf '%s\n' "$TAG_PLAN" | sed -n '2p')
      TAGS_ARGS=""
      for tag in $IMMUTABLE_TAGS $MOVING_TAGS; do
        TAGS_ARGS="$TAGS_ARGS -t $PUBLISH_IMAGE:$tag"
      done

      if [ -z "$TAGS_ARGS" ]; then
        echo "No tags to publish for this pipeline"
        exit 0
      fi

      if [ -z "$CANDIDATE_DIGEST" ] || [ "$CANDIDATE_DIGEST" = "none" ]; then
        echo "ERROR: CANDIDATE_DIGEST not exported by the build stage, refusing to publish an unscanned image" >&2
        exit 1
      fi
      CANDIDATE_REF="$CANDIDATE_IMAGE@$CANDIDATE_DIGEST"

      if [ "$PUBLISH_IMAGE" = "docker.io/$IMAGE_NAME" ]; then
        sh scripts/publish-dockerhub.sh \
          "$PUBLISH_IMAGE" "$CANDIDATE_REF" "$CANDIDATE_DIGEST" "$IMMUTABLE_TAGS" "$MOVING_TAGS"
      else
        echo "Promoting scanned candidate $CANDIDATE_REF to: $TAGS_ARGS"
        docker buildx imagetools create $TAGS_ARGS "$CANDIDATE_REF"
      fi

publish:gitlab:
  extends: .docker-publish-template
  variables:
    PUBLISH_IMAGE: "$CI_REGISTRY_IMAGE"
  rules: *publish_rules

publish:dockerhub:
  extends: .docker-publish-template
  variables:
    PUBLISH_IMAGE: "docker.io/$IMAGE_NAME"
    PUBLISH_REGISTRY_LOGIN_CMD: 'echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin docker.io'
  rules: *dockerhub_publish_rules

# ── Release ──────────────────────────────────────────────────────────────────

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0@sha256:3f52d526f48e8d10625c722fa6d6423ee82aadeae1b1aa91f07b62551d96dacf
  cache: []
  # publish:dockerhub is intentionally not required: it is optional (gated on
  # DOCKERHUB_* secrets) and the release notes only reference the GitLab
  # package + registry.
  needs:
    - job: publish:app
    - job: publish:gitlab
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - VERSION=$CI_COMMIT_TAG
    - CLEAN_VERSION=$(echo "$VERSION" | sed 's/^v//')
    - echo "Extracting release notes for $CLEAN_VERSION (from tag $VERSION)..."
    - |
      awk -v ver="$CLEAN_VERSION" '{ gsub(/\r$/, "") } /^## / { if ($2 == "v"ver || $2 == ver) flag=1; else flag=0; next } flag' CHANGELOG.md > release_notes.txt
    - |
      if [ ! -s release_notes.txt ]; then
        echo "No specific notes found in CHANGELOG.md for $VERSION." > release_notes.txt
      fi
    - PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/h5ai/${CLEAN_VERSION}/h5ai-${CLEAN_VERSION}.zip"
    - |
      release-cli create --name "$VERSION" \
        --description "$(cat release_notes.txt)" \
        --assets-link "{\"name\":\"h5ai-${CLEAN_VERSION}.zip\",\"url\":\"${PACKAGE_URL}\",\"link_type\":\"package\"}"

# ── Cleanup ──────────────────────────────────────────────────────────────────

# Removes the branch image once test:docker and scan:grype:branch-image are
# done, whatever their result. A cancelled pipeline skips .post; build:image
# prunes what it left after a day.
cleanup:image:
  stage: .post
  image: $DOCKER_IMAGE
  cache: []
  script:
    - docker rmi "h5ai-ci:$CI_PIPELINE_ID" >/dev/null 2>&1 || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "master"
      when: always
