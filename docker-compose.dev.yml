services:
  h5ai-devel:
    build:
      context: .
      dockerfile: Dockerfile
    image: h5ai-devel
    ports:
      - 8888:80
    # Thumbnail fixtures and the Markdown docs, to browse and preview.
    volumes:
      - ./test/docker/fixtures:/share/test:ro
      - ./doc:/share/doc:ro
      - ./README.md:/share/README.md:ro
      - ./CHANGELOG.md:/share/CHANGELOG.md:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
