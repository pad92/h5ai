# Include inside the server block and adjust /_h5ai/ if h5ai uses another URL prefix.
location ^~ /_h5ai/private/ {
    deny all;
    return 404;
}

location ~ ^/_h5ai/(?:\.htaccess|private)(?:/|$) {
    deny all;
    return 404;
}

# The public PHP entry point still needs the deployment's normal PHP-FPM rule.
location = /_h5ai/public/index.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php/php-fpm.sock;
}

# Prevent direct static downloads from following symlinks outside the served
# root. Adjust the path if the virtual host uses a different document root.
disable_symlinks on from=$document_root;
