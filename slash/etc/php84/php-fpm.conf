[global]
pid = /run/php-fpm84.pid
error_log = /var/log/php84/error.log

[www]
user = angie
group = angie
listen = /var/run/php-fpm.sock
listen.owner = angie
listen.group = angie
listen.mode = 0660
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000
; Recycle workers left behind by a slow request instead of letting them pile up
; and starve the pool. This does not help against a mount that hangs outright:
; the kernel leaves those workers in uninterruptible I/O, where the signal
; stays pending. No request_slowlog_timeout here: dumping the slowlog
; backtrace needs ptrace(ATTACH), which requires CAP_SYS_PTRACE, dropped by
; Docker's default capability set, so every trigger logged
; "failed to ptrace(ATTACH) ... Operation not permitted" instead of a trace.
; Per-request timing is already in Angie's access log (rt=/ut= fields).
request_terminate_timeout = 60s
catch_workers_output = yes
; error_log() messages (h5ai's notices, PHP warnings) reach the container
; log once, as "NOTICE: PHP message: ...". PHP also sent each one over
; FastCGI, which Angie logged a second time as "[error] FastCGI sent in
; stderr"; fastcgi.logging stops that copy. Without decorate_workers_output,
; the master no longer wraps the line in "WARNING: [pool www] child N said
; into stderr". (A worker error_log of /proc/self/fd/2 cannot work: the
; worker runs as angie and may not reopen the master's pipe, so PHP falls
; back to this same path.)
decorate_workers_output = no
php_admin_flag[fastcgi.logging] = off
clear_env = yes
; h5ai resolves the indexed directory from getenv('H5AI_ROOT_PATH'); since
; clear_env strips the inherited environment from workers, pass it through
; explicitly from the master process. Without this, h5ai falls back to
; dirname(H5AI_PATH) and indexes /usr/share/h5ai instead of /share.
env[H5AI_ROOT_PATH] = $H5AI_ROOT_PATH
